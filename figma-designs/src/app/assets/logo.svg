<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern, minimal Rosetta logo - abstract "R" with translation concept -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main R shape -->
  <path d="M10 8 L10 32 M10 8 L20 8 C24 8 24 12 24 14 C24 16 24 20 20 20 L10 20" 
        stroke="url(#grad1)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Diagonal leg of R -->
  <path d="M18 20 L26 32" 
        stroke="url(#grad1)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Translation arrows - subtle accent -->
  <path d="M28 12 L32 16 L28 20" 
        stroke="#6EE7B7" 
